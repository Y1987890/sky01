<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>优选商城 - 传统与现代的完美融合</title>
    <link rel="stylesheet" href="css/chinese-style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/element-ui@2.15.14/lib/theme-chalk/index.css">
    <script src="https://cdn.jsdelivr.net/npm/vue@2.7.14/dist/vue.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/element-ui@2.15.14/lib/index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.6.2/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
</head>
<body>
    <div id="app">
        <div v-if="currentPage === 'home'">
            <home-page @navigate="navigateTo" @login="showLogin" @register="showRegister"></home-page>
        </div>
        <div v-else-if="currentPage === 'category'">
            <category-page :category-id="currentCategoryId" @navigate="navigateTo" @login="showLogin" @register="showRegister"></category-page>
        </div>
        <div v-else-if="currentPage === 'product-detail'">
            <product-detail-page :product-id="currentProductId" @navigate="navigateTo"></product-detail-page>
        </div>
        <div v-else-if="currentPage === 'cart'">
            <cart-page @navigate="navigateTo"></cart-page>
        </div>
        <div v-else-if="currentPage === 'checkout'">
            <checkout-page @navigate="navigateTo"></checkout-page>
        </div>
        <div v-else-if="currentPage === 'address-manager'">
            <address-manager-page @navigate="navigateTo"></address-manager-page>
        </div>
        <div v-else-if="currentPage === 'user-center'">
            <user-center-page :active-tab="userTab" @navigate="navigateTo"></user-center-page>
        </div>
        <div v-else-if="currentPage === 'admin-login'">
            <admin-login-page @navigate="navigateTo"></admin-login-page>
        </div>
        <div v-else-if="currentPage === 'admin-dashboard'">
            <admin-dashboard :active-tab="adminTab" @navigate="navigateTo"></admin-dashboard>
        </div>

        <el-dialog title="用户登录" :visible.sync="loginVisible" width="400px" custom-class="chinese-dialog">
            <el-form :model="loginForm" label-width="80px">
                <el-form-item label="用户名">
                    <el-input v-model="loginForm.username" placeholder="请输入用户名"></el-input>
                </el-form-item>
                <el-form-item label="密码">
                    <el-input v-model="loginForm.password" type="password" placeholder="请输入密码"></el-input>
                </el-form-item>
            </el-form>
            <span slot="footer" class="dialog-footer">
                <el-button @click="loginVisible = false">取消</el-button>
                <el-button type="primary" @click="handleLogin">登录</el-button>
            </span>
        </el-dialog>

        <el-dialog title="用户注册" :visible.sync="registerVisible" width="400px" custom-class="chinese-dialog">
            <el-form :model="registerForm" label-width="80px">
                <el-form-item label="用户名">
                    <el-input v-model="registerForm.username" placeholder="请输入用户名"></el-input>
                </el-form-item>
                <el-form-item label="密码">
                    <el-input v-model="registerForm.password" type="password" placeholder="请输入密码"></el-input>
                </el-form-item>
                <el-form-item label="确认密码">
                    <el-input v-model="registerForm.confirmPassword" type="password" placeholder="请确认密码"></el-input>
                </el-form-item>
                <el-form-item label="邮箱">
                    <el-input v-model="registerForm.email" placeholder="请输入邮箱"></el-input>
                </el-form-item>
                <el-form-item label="手机号">
                    <el-input v-model="registerForm.phone" placeholder="请输入手机号"></el-input>
                </el-form-item>
            </el-form>
            <span slot="footer" class="dialog-footer">
                <el-button @click="registerVisible = false">取消</el-button>
                <el-button type="primary" @click="handleRegister">注册</el-button>
            </span>
        </el-dialog>
    </div>

    <script src="js/api.js"></script>
    <script src="js/components/home-page.js"></script>
    <script src="js/components/category-page.js"></script>
    <script src="js/components/product-detail-page.js"></script>
    <script src="js/components/cart-page.js"></script>
    <script src="js/components/checkout-page.js"></script>
    <script src="js/components/address-manager-page.js"></script>
    <script src="js/components/user-center-page.js"></script>
    <script src="js/components/admin-login-page.js"></script>
    <script src="js/components/admin-dashboard.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
