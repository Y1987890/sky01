spring.application.name=qmjava
server.port=8080

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/shopping_mall?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=mysql
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# SQL Initialization
spring.sql.init.mode=never
spring.sql.init.schema-locations=classpath:sql/mysql_init.sql
spring.sql.init.continue-on-error=true
spring.sql.init.separator=;

mybatis-plus.mapper-locations=classpath:mapper/*.xml
mybatis-plus.type-aliases-package=com.example.qmjava.entity
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

jwt.secret=qmjava2024shoppingmallsecretkeyqmjava2024shoppingmall
jwt.expiration=86400000

file.upload.path=D:/upload/
file.access-url=http://localhost:8080/uploads/
